<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white p-10">

<!-- 🔝 HEADER -->
<div class="flex justify-between mb-6 items-center">

  <h1 class="text-3xl">🎬 Movies</h1>

  <div id="auth" class="flex items-center gap-4"></div>

</div>

<!-- 🎬 MOVIES GRID -->
<div id="movies" class="grid grid-cols-3 gap-6"></div>

<script>

const authDiv = document.getElementById("auth");

const user = JSON.parse(localStorage.getItem("user"));
const loggedIn = localStorage.getItem("loggedIn");

// 🔐 AUTH UI
if(loggedIn === "true" && user){
  authDiv.innerHTML = `
    <button onclick="location.href='my-bookings.html'" 
      class="bg-yellow-500 px-4 py-1 rounded hover:bg-yellow-600">
      My Bookings
    </button>

    <span>👤 ${user.name}</span>

    <button onclick="logout()" 
      class="bg-red-500 px-3 py-1 rounded hover:bg-red-700">
      Logout
    </button>
  `;
} else {
  authDiv.innerHTML = `
    <button onclick="location.href='login.html'" 
      class="bg-green-500 px-3 py-1 rounded hover:bg-green-700">
      Login
    </button>

    <button onclick="location.href='register.html'" 
      class="bg-blue-500 px-3 py-1 rounded hover:bg-blue-700">
      Register
    </button>
  `;
}

// 🔓 LOGOUT
function logout(){
  localStorage.removeItem("user");
  localStorage.setItem("loggedIn","false");
  location.reload();
}

// 🎬 LOAD MOVIES
async function load(){
  const movies = await fetch("/movies").then(r=>r.json());

  const container = document.getElementById("movies");

  movies.forEach(m=>{
    const div = document.createElement("div");

    div.className =
    "bg-gray-800 p-4 rounded cursor-pointer transform transition duration-300 hover:scale-105 hover:shadow-2xl";

    div.innerHTML = `
      <img src="${m.poster}" class="w-full h-48 object-cover mb-3 rounded"/>
      <h2 class="text-xl font-bold hover:text-yellow-400 transition">${m.name}</h2>
      <p>${m.description}</p>
    `;

    div.onclick = ()=> window.location.href=`shows.html?movie=${m.id}`;

    container.appendChild(div);
  });
}

load();

</script>

</body>
</html>
