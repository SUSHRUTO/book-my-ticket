<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black flex items-center justify-center h-screen">

<div class="bg-gray-900 p-8 rounded-xl shadow-lg w-80 text-white">

<h2 class="text-2xl font-bold mb-6 text-center">🔐 Login</h2>

<input id="email" placeholder="Email"
class="w-full p-2 mb-3 rounded text-black"/>

<input id="pass" type="password" placeholder="Password"
class="w-full p-2 mb-4 rounded text-black"/>

<button onclick="login()"
class="w-full bg-blue-500 py-2 rounded hover:bg-blue-700">
Login
</button>

<p class="text-center mt-4 text-sm">
Don't have an account?
<a href="register.html" class="text-blue-400">Register</a>
</p>

</div>

<script>
function login(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  const users = JSON.parse(localStorage.getItem("users")) || [];

  const found = users.find(u => u.email === email && u.password === pass);

  if(found){
    localStorage.setItem("user", JSON.stringify(found));
    localStorage.setItem("loggedIn","true");
    location.href="index.html";
  } else {
    alert("Invalid credentials");
  }
}
</script>

</body>
</html>
