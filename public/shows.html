<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex items-center justify-center h-screen">

<div class="bg-gray-900 p-10 rounded w-[400px] text-center">

<h1 class="text-2xl mb-6">🎬 Select Showtime</h1>

<input type="date" id="date" class="text-black p-2 mb-3 w-full"/>

<select id="hall" class="text-black p-2 w-full mb-3">
  <option value="">Select Hall</option>
  <option value="PVR Cinema Hall">PVR Cinema Hall</option>
  <option value="INOX City Centre">INOX City Centre</option>
</select>

<button onclick="loadShows()" class="bg-green-500 w-full py-2 mb-4">
Apply Filter
</button>

<div id="times" class="flex flex-col gap-3"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const movieId = params.get("movie");

async function loadShows(){
  const date = document.getElementById("date").value;
  const hall = document.getElementById("hall").value;

  let url = `/movies/shows/${movieId}`;
  if(date || hall) url += `?date=${date}&hall=${hall}`;

  const shows = await fetch(url).then(r=>r.json());

  const container = document.getElementById("times");
  container.innerHTML = "";

  if(shows.length === 0){
    container.innerHTML = "<p>No shows available</p>";
    return;
  }

  shows.forEach(show=>{
    const btn = document.createElement("button");
    btn.className = "bg-blue-500 p-3 rounded";
    btn.innerText = `${show.show_time} | ${show.hall_name}`;

    btn.onclick = () => {
      window.location.href = `category.html?show=${show.id}`;
    };

    container.appendChild(btn);
  });
}
</script>

</body>
</html>
