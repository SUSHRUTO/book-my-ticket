<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white flex items-center justify-center h-screen">

<div class="bg-gray-800 p-8 rounded w-80 text-center">

<h2 class="text-xl mb-4">Verify OTP</h2>

<input id="otp" placeholder="Enter OTP" class="p-2 w-full text-black mb-4"/>

<button onclick="verify()" class="bg-green-500 w-full py-2">Verify</button>

</div>

<script>
function verify(){
  const entered = document.getElementById("otp").value.trim();

  const temp = JSON.parse(localStorage.getItem("tempUser"));

  if(!temp){
    alert("Session expired. Register again.");
    location.href = "register.html";
    return;
  }

  if(entered == temp.otp){

    let users = JSON.parse(localStorage.getItem("users")) || [];

    users.push({
      name: temp.name,
      email: temp.email,
      password: temp.pass
    });

    localStorage.setItem("users", JSON.stringify(users));

    alert("Registration successful!");
    location.href = "login.html";

  } else {
    alert("Invalid OTP");
  }
}
</script>

</body>
</html>
