<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white p-10">

<h1 class="text-3xl mb-6 font-bold">👨‍💼 Admin Dashboard</h1>

<div id="data"></div>

<script>
async function load(){
  const res = await fetch("/admin/bookings");
  const data = await res.json();

  const container = document.getElementById("data");
  container.innerHTML = "";

  if(data.length === 0){
    container.innerHTML = "<p class='text-gray-400'>No bookings yet</p>";
    return;
  }

  data.forEach(d=>{
    const div = document.createElement("div");

    div.className = "bg-gray-800 p-5 mb-4 rounded shadow";

    div.innerHTML = `
      <p class="text-lg font-semibold">🎬 ${d.movie_name}</p>
      <p>⏰ ${d.show_time}</p>
      <p>💺 Seat: ${d.seat_number}</p>
      <p>👤 Booked by: <span class="text-green-400">${d.booked_by}</span></p>
    `;

    container.appendChild(div);
  });
}

load();
</script>

</body>
</html>
